; deskpet — Waveshare ESP32-S3-Touch-AMOLED-1.75
; Placa base esp32-s3-devkitc-1 ajustada a ESP32-S3R8: 16 MB flash (QIO) + 8 MB PSRAM (OPI).
;
; Plataforma: pioarduino (Arduino-ESP32 core 3.3.x). Los ejemplos oficiales de Waveshare se
; compilan con core 3.3.10; la plataforma oficial de PlatformIO sólo trae core 2.x.

[platformio]
default_envs = deskpet

[env:deskpet]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Memoria ---
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = partitions_16MB_ota.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; --- USB nativo (USB-Serial/JTAG) ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; Warnings estrictos sólo para nuestro código (no para las librerías).
build_src_flags =
    -Wall
    -Wextra

; Fijadas por etiqueta de GitHub. SensorLib 0.3.1 es la misma que traen los ejemplos de Waveshare.
; GFX: Waveshare incluye una 1.6.4 parcheada; la 1.6.4 original no compila con core >= 3.3.6
; (cambió spiFrequencyToClockDiv). La 1.6.5 trae esa corrección y no cambia CO5300 ni QSPI.
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.5
    https://github.com/lewisxhe/SensorLib.git#v0.3.1
