# Envía a las tiendas el último build de producción que ya terminó en EAS, sin
# volver a compilar: iOS → App Store Connect / TestFlight; Android → prueba
# interna de Google Play. Manual: Actions → Enviar a tiendas (EAS Submit) →
# Run workflow, sólo desde main. Usa las llaves guardadas en EAS (App Store
# Connect API Key y cuenta de servicio de Google) y el perfil submit.production
# de eas.json. Requiere el secret EXPO_TOKEN del environment production.
# Google Play: la primera versión de la app se sube a mano (docs/modules/ci-cd.md).
name: Enviar a tiendas (EAS Submit)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Tienda
        type: choice
        options: [ios, android, all]
        default: ios
      build_id:
        description: ID del build de EAS (opcional; vacío = el más reciente). Úsalo si hay un build de preview más nuevo.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mobile-submit-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  submit:
    name: eas submit (production, ${{ inputs.platform }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - name: Verificar EXPO_TOKEN
        run: |
          [[ -n "$EXPO_TOKEN" ]] || { echo "::error::Falta el secret EXPO_TOKEN (docs/modules/ci-cd.md)."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verificar el perfil de envío en eas.json
        run: node scripts/check-store-submit.mjs "$PLATFORM"
      - run: npm ci
      # Encola el envío en EAS y termina; el progreso se ve en expo.dev → Submissions.
      - name: Enviar
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          if [[ -n "$BUILD_ID" ]]; then
            [[ "$PLATFORM" != "all" ]] || { echo "::error::Con build_id elige ios o android."; exit 1; }
            [[ "$BUILD_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::build_id inválido."; exit 1; }
            npx --yes eas-cli@24.8.0 submit --profile production --platform "$PLATFORM" --id "$BUILD_ID" --non-interactive --no-wait
          else
            npx --yes eas-cli@24.8.0 submit --profile production --platform "$PLATFORM" --latest --non-interactive --no-wait
          fi
